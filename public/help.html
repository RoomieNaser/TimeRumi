<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>HelpRumi</title>
    <link rel="stylesheet" href="help.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;500&display=swap" rel="stylesheet">
</head>
<body class="loaded">
    <header>   
      <div class="logo">HelpRumi</div>
      <nav>
        <ul class="nav-links">
          <li><a href="https://discord.gg/rmnd43u5gv" target="_blank">
            <img src="/assets/discord-svgrepo-com.svg" alt="discord" width="24px" height="24px">
            </a>
          </li>

          <li><a href="https://www.youtube.com/@RoomixCubing/" target="_blank">
            <img src="/assets/youtube-light.svg" alt="youtube" width="24px" height="24px">
            </a>
          </li>

          <li>
            <a href="/index.html">  
              <img src="/assets/cube-filled-svgrepo-com.svg" alt="help" width="20px" height="24px" >
            </a>
          </li>
        </ul>        
      </nav>
      <button class="donate-btn"><a href="https://streamelements.com/roomixcubing/tip" target="_blank">Donate</a></button>
    </header>
    <h1>What do yo need help with?</h1>
    <div class="boxes">
      <div class="glass-box" id="singleplayer-help">
            <h2>Singleplayer Help</h2>
            <div class="svg-wrapper">
                <img src="/assets/singleplayer.svg" alt="Singleplayer" class="card-svg" id="singleplayer-card">
            </div>
      </div>
      <div class="glass-box" id="multiplayer-help">
        <h2>Multiplayer Help</h2>
        <div class="svg-wrapper">
            <img src="/assets/multiplayerIcon.svg" alt="Multiplayer" class="card-svg" id="multiplayer-card">
        </div>

      </div>
      <div class="glass-box" id="stream-help">
        <h2>Streaming Help</h2>
        <div class="svg-wrapper">
            <img src="/assets/streamerIcon.svg" alt="Streaming" class="card-svg" id="stream-card" width="246px">
        </div>

      </div>
    </div>

    
</body>
</html>
