<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>HelpRumi</title>
    <link rel="stylesheet" href="help.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;500&display=swap" rel="stylesheet">
</head>
<body class="loaded">
    <header class="header">   
      <div class="logo">HelpRumi</div>
      <nav>
        <ul class="nav-links">
          <li><a href="https://discord.gg/rmnd43u5gv" target="_blank">
            <img src="/assets/discord-svgrepo-com.svg" alt="discord" width="24px" height="24px">
            </a>
          </li>

          <li><a href="https://www.youtube.com/@RoomixCubing/" target="_blank">
            <img src="/assets/youtube-light.svg" alt="youtube" width="24px" height="24px">
            </a>
          </li>

          <li>
            <a href="/index.html">  
              <img src="/assets/cube-filled-svgrepo-com.svg" alt="help" width="20px" height="24px" >
            </a>
          </li>
        </ul>        
      </nav>
      <button class="donate-btn"><a href="https://streamelements.com/roomixcubing/tip" target="_blank">Donate</a></button>
    </header>
    <h1>What do yo need help with?</h1>
    <div class="boxes">
      <div class="glass-box" id="singleplayer-help">
            <h2>Singleplayer Help</h2>
            <div class="svg-wrapper">
                <img src="/assets/singleplayer.svg" alt="Singleplayer" class="card-svg" id="singleplayer-card">
            </div>
      </div>
      <div class="glass-box" id="multiplayer-help">
        <h2>Multiplayer Help</h2>
        <div class="svg-wrapper">
            <img src="/assets/multiplayerIcon.svg" alt="Multiplayer" class="card-svg" id="multiplayer-card">
        </div>

      </div>
      <div class="glass-box" id="stream-help">
        <h2>Streaming Help</h2>
        <div class="svg-wrapper">
            <img src="/assets/streamerIcon.svg" alt="Streaming" class="card-svg" id="stream-card" width="246px">
        </div>

      </div>
    </div>

    <div class="help-contents">
        <div class="help-title">
            <h3>· How To Use The Timer:</h3>
            <img src="assets/singleplayer.svg" alt="(Singleplayer Mode)" class="help-title-svg">
        </div>

        <section class="container">
            <div class="slider-wrapper">
                <div class="slider">
                    <img src="assets/helpCarouselSteps/singleplayer-step1.png" alt="Click the singleplayer button to enter solo mode, no need for a name" id="sp-tutorial-slide-1">
                    <img src="assets/helpCarouselSteps/singleplayer-step2.png" alt="You will be greeted to this page with the scramble, the timer UI, and the averages of 5 and 12" id="sp-tutorial-slide-2">
                    <img src="assets/helpCarouselSteps/singleplayer-step3.png" alt="Hold space to prepare the timer. The timer will not start and will stay green until you release" id="sp-tutorial-slide-3">
                    <img src="assets/helpCarouselSteps/singeplayer-step4.png" alt="Solve the cube while the timer is running!" id="sp-tutorial-slide-4">
                    <img src="assets/helpCarouselSteps/singleplayer-step5.png" alt="If you did not comply with the WCA guidelines to comepletely solve the Rubik's cube, apply the appropriate penalty" id="sp-tutorial-slide-5">
                    <img src="assets/helpCarouselSteps/singleplayer-step6.png" alt="Use the button to the left to access your statistics" id="sp-tutorial-slide-6">
                    <img src="assets/helpCarouselSteps/singleplayer-step7.png" alt="Had a bad solve? Changed your mind on penalties? Access penalties and solve deletion through the statistics panel" id="sp-tutorial-slide-7">
                    <img src="assets/helpCarouselSteps/singleplayer-step8.png" alt="Delete all of your solves using this button. It will ask for confirmation" id="sp-tutorial-slide-8">
                    <img src="assets/helpCarouselSteps/singleplayer-step9.png" alt="Export your solves as a csv file. This will directly download to your computer" id="sp-tutorial-slide-9">
                    <img src="assets/helpCarouselSteps/singleplayer-step10.png" alt="Customize to your liking using the settings button and enjoy!" id="sp-tutorial-slide-10">

                </div>
                <div class="slider-nav">
                    <a href="#sp-tutorial-slide-1" class="nav-dot"></a>
                    <a href="#sp-tutorial-slide-2" class="nav-dot"></a>
                    <a href="#sp-tutorial-slide-3" class="nav-dot"></a>
                    <a href="#sp-tutorial-slide-4" class="nav-dot"></a>
                    <a href="#sp-tutorial-slide-5" class="nav-dot"></a>
                    <a href="#sp-tutorial-slide-6" class="nav-dot"></a>
                    <a href="#sp-tutorial-slide-7" class="nav-dot"></a>
                    <a href="#sp-tutorial-slide-8" class="nav-dot"></a>
                    <a href="#sp-tutorial-slide-9" class="nav-dot"></a>
                    <a href="#sp-tutorial-slide-10" class="nav-dot"></a>
                </div>
            </div>
            <p id="carousel-description" class="carousel-desc">
                Click the singleplayer button to enter solo mode, no need for a name
            </p>


        </section>
    </div>

    <script src="help.js"></script>
</body>
</html>
